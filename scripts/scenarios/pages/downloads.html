<!doctype html><html><head><meta charset="utf-8"><title>Mimic Files</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>Mimic Files</strong></header>
<main><h1>Your files</h1>
<h2>Annual report 2025</h2><p>PDF, 2.1 MB</p><button data-file="report">Download</button>
<h2>Invoice 1042</h2><p>PDF, 84 KB</p><button data-file="invoice">Download</button></main>
<script src="mimic.js"></script>
<script>mimic.set('downloaded','none');
// Records which button was pressed; nothing is downloaded.
for(const b of document.querySelectorAll('button'))b.addEventListener('click',()=>mimic.set('downloaded',b.dataset.file))</script>
</body></html>
