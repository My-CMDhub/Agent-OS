<!doctype html><html><head><meta charset="utf-8"><title>Mimic Portal — Sign in</title><link rel="stylesheet" href="style.css"></head><body>
<header><strong>Mimic Portal</strong></header>
<main><h1>Sign in to see your account</h1><p>Your account summary is shown after you sign in.</p>
<label for="user">Username</label><input id="user" autocomplete="off">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="off">
<button id="go" type="button">Sign in</button></main>
<script src="mimic.js"></script>
<script>const pw=document.getElementById('pw');function typed(){mimic.set('passwordChars',pw.value.length)}typed();pw.addEventListener('input',typed)</script>
</body></html>
